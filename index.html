<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Wooley - Developer Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const Navbar = () => (
        <nav class="fixed top-0 w-full bg-gray-800/90 backdrop-blur-sm z-50 border-b border-gray-700">
            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <a href="#" class="text-xl font-bold text-white">Cooper Wooley</a>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex gap-6">
                        <a href="#about" class="text-gray-300 hover:text-[#008f5d] transition-colors">About</a>
                        <a href="#projects" class="text-gray-300 hover:text-[#008f5d] transition-colors">Projects</a>
                        <a href="#contact" class="text-gray-300 hover:text-[#008f5d] transition-colors">Contact</a>
                        <a href="../resumes/Cooper_Wooley_Resume.pdf" download class="text-gray-300 hover:text-[#008f5d] transition-colors">Resume</a>
                    </div>
                    <div class="flex gap-4">
                        <a href="https://github.com/cooperwooley" target="_blank" class="text-gray-300 hover:text-[#008f5d]">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.11.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.082-.73.082-.73 1.205.085 1.838 1.236 1.838 1.236 2.135 1.885 3.657 1.23 3.657 1.23.066-.935.255-1.885.458-2.286-1.605-.175-3.292-.826-3.292-3.676 0-.81.288-1.475.765-1.995-.077-.19-.33-.955.072-1.99 0 0 .63-.2 2.065.765A7.15 7.15 0 0112 6c1.28 0 2.56.428 3.555.885 1.435-.965 2.065-.765 2.065-.765.402 1.035.15 1.8.073 1.99.477.52.765 1.185.765 1.995 0 2.86-1.69 3.5-3.3 3.675.26.225.49.69.49 1.39 0 1-.015 1.81-.015 2.05 0 .32.215.695.825.575C20.562 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
                            </svg>
                        </a>
                        <a href="https://linkedin.com/in/cooperwooley" target="_blank" class="text-gray-300 hover:text-[#008f5d]">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.327-.027-3.037-1.852-3.037-1.854 0-2.137 1.446-2.137 2.94v5.666H9.351V9.001h3.414v1.561h.049c.476-.9 1.635-1.852 3.366-1.852 3.598 0 4.267 2.368 4.267 5.455v6.287zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.068 0-1.142.92-2.068 2.063-2.068 1.14 0 2.064.926 2.064 2.068 0 1.142-.925 2.068-2.064 2.068zm1.78 13.019H3.557V9.001h3.56v11.451zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.454C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        );

        const About = () => (
            <section id="about" class="pt-24 pb-16 max-w-6xl mx-auto px-4">
                <h1 class="text-4xl md:text-5xl font-bold mb-6">
                    Hey, I'm <span class="text-[#008f5d]">Cooper</span>
                </h1>
                <div class="flex flex-col md:flex-row gap-8 items-center">
                    <div class="md:w-2/3">
                        <p class="text-gray-300 text-lg leading-relaxed">
                            I'm a senior at Missouri S&T, chasing a B.S. in Computer Science. 
                            Whether it's crafting embedded software for microcontrollers or building smart dashboards, I live for solving real-world puzzles.
                            Lately, I've caught the AI bug—machine learning and deep learning have me captivated.
                            With a strong technical toolkit, I'm itching to make my mark as a Software Engineer or Machine Learning Engineer.
                        </p>
                        <a 
                            href="../resumes/Cooper_Wooley_Resume.pdf" 
                            download 
                            class="mt-6 inline-block bg-[#008f5d] text-white px-6 py-2 rounded hover:bg-[#006d45] transition-colors"
                        >
                            Download Resume
                        </a>
                    </div>
                    <img src="../images/pfp.jpg" alt="Cooper Wooley" class="w-48 h-48 rounded-full border-4 border-[#008f5d] object-cover"/>
                </div>
            </section>
        );

        const ProjectCard = ({ title, description, image, link, tech }) => (
            <div class="bg-gray-800 rounded-lg overflow-hidden hover:shadow-xl hover:shadow-[#008f5d]/20 transition-all duration-300">
                <img src={image} alt={title} class="w-full h-48 object-cover"/>
                <div class="p-6">
                    <h3 class="text-xl font-semibold mb-2">{title}</h3>
                    <p class="text-gray-400 mb-4">{description}</p>
                    <div class="flex flex-wrap gap-2 mb-4">
                        {tech.map((icon, index) => (
                            <img key={index} src={icon} alt="tech icon" class="w-6 h-6"/>
                        ))}
                    </div>
                    <a href={link} target="_blank" class="inline-block bg-[#008f5d] text-white px-4 py-2 rounded hover:bg-[#006d45] transition-colors">
                        View Project →
                    </a>
                </div>
            </div>
        );

        const Projects = () => (
            <section id="projects" class="py-16 bg-gray-800">
                <div class="max-w-6xl mx-auto px-4">
                    <h2 class="text-3xl font-bold mb-12 text-center">Projects</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <ProjectCard
                            title="ParkVision"
                            description="A web-based dashboard that leverages computer vision and backend infrastructure to deliver a real-time smart parking management system. It detects parked vehicles from live or recorded camera feeds and maps them onto a top-down lot view."
                            image="../images/parkvision.png"
                            link="https://github.com/cooperwooley/parkvision"
                            tech={["../images/python.svg", "../images/flask.svg", "../images/opencv.svg", "../images/docker.svg"]}
                        />
                        <ProjectCard
                            title="CS2 Workshop Map Queue Discord Bot"
                            description="A Discord bot designed to queue 10 players into CS2 workshop map games, with automated team selection, map vetoes, and server management."
                            image="../images/logo.jpg"
                            link="https://github.com/NotExift/10mansbot"
                            tech={["../images/python.svg", "../images/discord.svg", "../images/html5.svg", "../images/docker.svg"]}
                        />
                        <ProjectCard
                            title="Portfolio Website"
                            description="A modern, responsive developer portfolio built with React and Tailwind CSS showcasing my projects and skills."
                            image="../images/under-construction.jpg"
                            link="#"
                            tech={["../images/html5.svg", "../images/css3.svg", "../images/javascript.svg"]}
                        />
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" class="py-16 max-w-6xl mx-auto px-4">
                <h2 class="text-3xl font-bold mb-12 text-center">Get in Touch</h2>
                <div class="flex flex-col md:flex-row gap-12">
                    <div class="md:w-1/2">
                        <h3 class="text-xl font-semibold mb-4">Have any questions?</h3>
                        <p class="text-gray-300 mb-4">Feel free to reach out about anything. I'll respond as soon as possible!</p>
                        <a href="mailto:coopermw03@gmail.com" class="text-[#008f5d] hover:underline">
                            coopermw03@gmail.com
                        </a>
                    </div>
                    <div class="md:w-1/2 bg-gray-800 p-6 rounded-lg">
                        <form action="https://formspree.io/f/xpwaenny" method="POST" class="flex flex-col gap-4">
                            <input 
                                type="text" 
                                name="name"
                                placeholder="Name" 
                                required 
                                class="w-full p-3 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-[#008f5d]"
                            />
                            <input 
                                type="email" 
                                name="email"
                                placeholder="Email" 
                                required 
                                class="w-full p-3 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-[#008f5d]"
                            />
                            <textarea 
                                name="message"
                                placeholder="Message" 
                                required 
                                class="w-full p-3 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-[#008f5d] h-32"
                            ></textarea>
                            <button 
                                type="submit"
                                class="bg-[#008f5d] text-white px-6 py-2 rounded hover:bg-[#006d45] transition-colors"
                            >
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar />
                <About />
                <Projects />
                <Contact />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
