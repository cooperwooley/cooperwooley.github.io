    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ─── Intersection Observer Hook ─── */
        const useScrollReveal = () => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('visible');
                            }
                        });
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                );
                const elements = ref.current?.querySelectorAll('.scroll-animate');
                elements?.forEach((el) => observer.observe(el));
                return () => observer.disconnect();
            }, []);
            return ref;
        };

        /* ─── Typing Animation Hook ─── */
        const useTypingAnimation = (words, typingSpeed = 100, deletingSpeed = 60, pauseTime = 2000) => {
            const [text, setText] = useState('');
            const [wordIndex, setWordIndex] = useState(0);
            const [isDeleting, setIsDeleting] = useState(false);

            useEffect(() => {
                const currentWord = words[wordIndex];
                let timeout;

                if (!isDeleting && text === currentWord) {
                    timeout = setTimeout(() => setIsDeleting(true), pauseTime);
                } else if (isDeleting && text === '') {
                    setIsDeleting(false);
                    setWordIndex((prev) => (prev + 1) % words.length);
                } else {
                    timeout = setTimeout(() => {
                        setText(currentWord.substring(0, isDeleting ? text.length - 1 : text.length + 1));
                    }, isDeleting ? deletingSpeed : typingSpeed);
                }

                return () => clearTimeout(timeout);
            }, [text, isDeleting, wordIndex, words]);

            return text;
        };
